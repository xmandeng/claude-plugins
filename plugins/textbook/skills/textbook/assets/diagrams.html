<!--
  SVG diagram patterns for textbook figures. Copy a block into the document
  body where a figure belongs, then edit the labels/coordinates.

  RULES (learned the hard way):
  - Diagrams are inline SVG, never ASCII art and never HTML/CSS box stacks.
  - Style with inline attributes (fill/stroke/font-size) so figures do not
    depend on the stylesheet.
  - Give each <svg> a unique marker id (aA, aB, aC, ...) so arrowheads in one
    figure do not collide with another.
  - Use width="100%" + a viewBox. The patterns use a 620-unit-wide viewBox,
    which the 138 mm content column scales to about 0.22 mm per unit. At that
    scale, font-size 12 is about 7.5pt on the page, so keep caption text at 12
    or larger and secondary labels at 10.5 or larger. Smaller text forces a
    tablet reader to zoom. Widen the viewBox (e.g. 700) only when you need
    room for external annotations like braces; everything then scales down,
    so raise the font sizes to match.
  - Colors: navy #1f3756 / deep #16273d, gold #bd8b1c, green #2f6b3f,
    muted #5b6470, light fills #eef3f9 (blue) / #eef7f0 (green) / #faf6ec (gold).
  - Verify by reading the rendered PDF page as an image, not by trusting markup.

  Shared arrowhead marker (change the id per figure):
    <marker id="aX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3756"/>
    </marker>
-->

<!-- ============================================================
     PATTERN A — Vertical pipeline: small LEFT-ALIGNED nodes with
     caption text to the RIGHT of each node. Prefer this over big
     centered text-filled boxes for "stage -> stage -> stage" flows.
     ============================================================ -->
<svg class="diagram" viewBox="0 0 620 205" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Nimbus Sans','Liberation Sans',sans-serif">
  <defs>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3756"/>
    </marker>
  </defs>
  <rect x="12" y="12" width="150" height="44" rx="7" fill="#eef3f9" stroke="#1f3756" stroke-width="1.5"/>
  <text x="87" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#16273d">Node one</text>
  <text x="87" y="47" text-anchor="middle" font-size="10.5" fill="#5b6470">(subtitle)</text>
  <text x="182" y="31" font-size="12" fill="#1c1c1c">Caption line describing this node and</text>
  <text x="182" y="46" font-size="12" font-family="'Liberation Mono',monospace" fill="#243b57">any_code_it_returns</text>
  <line x1="87" y1="56" x2="87" y2="80" stroke="#1f3756" stroke-width="1.5" marker-end="url(#aA)"/>
  <rect x="12" y="80" width="150" height="44" rx="7" fill="#eef3f9" stroke="#1f3756" stroke-width="1.5"/>
  <text x="87" y="101" text-anchor="middle" font-size="12.5" font-weight="700" font-family="'Liberation Mono',monospace" fill="#16273d">node_two</text>
  <text x="87" y="116" text-anchor="middle" font-size="10.5" fill="#5b6470">(subtitle)</text>
  <text x="182" y="99" font-size="12" fill="#1c1c1c">Second caption. Keep nodes terse;</text>
  <text x="182" y="114" font-size="12" fill="#1c1c1c">put the prose out here on the right.</text>
  <line x1="87" y1="124" x2="87" y2="148" stroke="#1f3756" stroke-width="1.5" marker-end="url(#aA)"/>
  <rect x="12" y="148" width="150" height="42" rx="7" fill="#eef7f0" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="87" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b3f">final node</text>
  <text x="87" y="182" text-anchor="middle" font-size="10.5" fill="#5b6470">(result)</text>
  <text x="182" y="173" font-size="12" fill="#1c1c1c">Terminal caption &mdash; the result.</text>
</svg>

<!-- ============================================================
     PATTERN B — Before/after panels with a dashed cut seam and
     EXTERNAL braces grouping each sub-region. viewBox widened to
     700 to leave room for the braces + labels on the right.
     Note: the "before" panel deliberately has NO seam.
     ============================================================ -->
<svg class="diagram" viewBox="0 0 700 205" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Nimbus Sans','Liberation Sans',sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3756"/>
    </marker>
  </defs>
  <!-- left panel: no subdivision identified (no seam) -->
  <rect x="18" y="18" width="250" height="172" fill="#ffffff" stroke="#1f3756" stroke-width="1.5"/>
  <rect x="18" y="18" width="250" height="23" fill="#314f70"/>
  <text x="143" y="34" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Before (whole region)</text>
  <text x="30" y="66" font-size="11.5" font-weight="700" fill="#16273d">Part A title</text>
  <text x="30" y="81" font-size="10.5" fill="#5b6470">content A</text>
  <text x="30" y="121" font-size="11.5" font-weight="700" fill="#16273d">Part B title</text>
  <text x="30" y="136" font-size="10.5" fill="#5b6470">content B</text>
  <!-- connector -->
  <line x1="272" y1="104" x2="296" y2="104" stroke="#1f3756" stroke-width="1.5" marker-end="url(#aB)"/>
  <!-- right panel: after the cut -->
  <rect x="300" y="18" width="250" height="172" fill="#ffffff" stroke="#1f3756" stroke-width="1.5"/>
  <rect x="300" y="18" width="250" height="23" fill="#314f70"/>
  <text x="425" y="34" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">After (cut)</text>
  <text x="312" y="62" font-size="11.5" font-weight="700" fill="#16273d">Part A title</text>
  <text x="312" y="77" font-size="10.5" fill="#5b6470">content A</text>
  <line x1="300" y1="104" x2="550" y2="104" stroke="#bd8b1c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="544" y="116" text-anchor="end" font-size="9.5" fill="#bd8b1c">cut line</text>
  <text x="312" y="134" font-size="11.5" font-weight="700" fill="#16273d">Part B title</text>
  <text x="312" y="149" font-size="10.5" fill="#5b6470">content B</text>
  <!-- external braces grouping each sub-region -->
  <path d="M556,43 Q564,43 564,51 L564,64 Q564,72 572,72 Q564,72 564,80 L564,93 Q564,101 556,101" fill="none" stroke="#1f3756" stroke-width="1.2"/>
  <text x="578" y="75" font-size="10.5" fill="#1f3756">&#8594; piece 1</text>
  <path d="M556,107 Q564,107 564,115 L564,139 Q564,147 572,147 Q564,147 564,155 L564,179 Q564,187 556,187" fill="none" stroke="#1f3756" stroke-width="1.2"/>
  <text x="578" y="150" font-size="10.5" fill="#1f3756">&#8594; piece 2</text>
</svg>

<!-- ============================================================
     PATTERN C — Two-outcome control flow: entry box, an internal
     "probe" pill, then a branch into two columns (green success
     chain on the left, gold default on the right).
     ============================================================ -->
<svg class="diagram" viewBox="0 0 620 372" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Nimbus Sans','Liberation Sans',sans-serif">
  <defs>
    <marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3756"/>
    </marker>
  </defs>
  <rect x="180" y="8" width="260" height="36" rx="6" fill="#eef3f9" stroke="#1f3756" stroke-width="1.5"/>
  <text x="310" y="31" text-anchor="middle" font-size="12.5" font-weight="700" font-family="'Liberation Mono',monospace" fill="#16273d">entry(args)</text>
  <line x1="310" y1="44" x2="310" y2="55" stroke="#1f3756" stroke-width="1.5"/>
  <rect x="215" y="55" width="190" height="22" rx="11" fill="#f4f7fb" stroke="#9bb0c7" stroke-width="1"/>
  <text x="310" y="70" text-anchor="middle" font-size="11" fill="#5b6470">internal check</text>
  <path d="M310,77 V90 H160" fill="none" stroke="#1f3756" stroke-width="1.5"/>
  <path d="M310,90 H460" fill="none" stroke="#1f3756" stroke-width="1.5"/>
  <line x1="160" y1="90" x2="160" y2="104" stroke="#1f3756" stroke-width="1.5" marker-end="url(#aC)"/>
  <line x1="460" y1="90" x2="460" y2="104" stroke="#1f3756" stroke-width="1.5" marker-end="url(#aC)"/>
  <rect x="35" y="104" width="250" height="44" rx="6" fill="#eef7f0" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="160" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6b3f">condition holds</text>
  <text x="160" y="139" text-anchor="middle" font-size="10.5" fill="#5b6470">the success case</text>
  <line x1="160" y1="148" x2="160" y2="162" stroke="#1f3756" stroke-width="1.5" marker-end="url(#aC)"/>
  <rect x="35" y="162" width="250" height="42" rx="6" fill="#eef3f9" stroke="#1f3756" stroke-width="1.5"/>
  <text x="160" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#16273d">step 1</text>
  <text x="160" y="195" text-anchor="middle" font-size="10.5" fill="#5b6470">detail</text>
  <line x1="160" y1="204" x2="160" y2="218" stroke="#1f3756" stroke-width="1.5" marker-end="url(#aC)"/>
  <rect x="35" y="218" width="250" height="36" rx="6" fill="#eef7f0" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="160" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6b3f">return result</text>
  <rect x="335" y="104" width="250" height="44" rx="6" fill="#faf6ec" stroke="#bd8b1c" stroke-width="1.5"/>
  <text x="460" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a6f12">otherwise</text>
  <text x="460" y="139" text-anchor="middle" font-size="10.5" fill="#5b6470">the default case</text>
  <line x1="460" y1="148" x2="460" y2="162" stroke="#1f3756" stroke-width="1.5" marker-end="url(#aC)"/>
  <rect x="335" y="162" width="250" height="42" rx="6" fill="#faf6ec" stroke="#bd8b1c" stroke-width="1.5"/>
  <text x="460" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a6f12">return unchanged</text>
  <text x="460" y="195" text-anchor="middle" font-size="10.5" fill="#5b6470">the safe fallback</text>
</svg>

<!-- ============================================================
     PATTERN D — Vertical lineage / timeline. A connector spine with
     concentric node markers, a coloured ID badge, and caption text to
     the right. Top-level nodes sit on the spine (x=30); indented
     children branch off it (x=70). Colour-code by state: navy = main,
     green = spike/sub-item, grey = closed/superseded. Wrap in
     <svg class="lineage" ...>. No arrowheads — it reads top-to-bottom.
     ============================================================ -->
<svg class="lineage" viewBox="0 0 620 180" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Nimbus Sans','Liberation Sans',sans-serif">
  <!-- spine connecting the top-level nodes -->
  <line x1="30" y1="20" x2="30" y2="160" stroke="#9bb0c7" stroke-width="2"/>

  <!-- top-level node: concentric marker + navy badge + caption -->
  <circle cx="30" cy="20" r="8" fill="#fff" stroke="#1f3756" stroke-width="2"/><circle cx="30" cy="20" r="3.5" fill="#1f3756"/>
  <rect x="48" y="11" width="60" height="18" rx="9" fill="#1f3756"/><text x="78" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ID-1</text>
  <text x="118" y="24" font-size="11.5" fill="#1c1c1c">first milestone &mdash; a one-line description of it</text>

  <circle cx="30" cy="53" r="8" fill="#fff" stroke="#1f3756" stroke-width="2"/><circle cx="30" cy="53" r="3.5" fill="#1f3756"/>
  <rect x="48" y="44" width="60" height="18" rx="9" fill="#1f3756"/><text x="78" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ID-2</text>
  <text x="118" y="57" font-size="11.5" fill="#1c1c1c">second milestone &mdash; the umbrella for the spikes below</text>

  <!-- indented child (green): branch off the spine -->
  <line x1="30" y1="53" x2="70" y2="86" stroke="#9bb0c7" stroke-width="1.5"/>
  <circle cx="70" cy="86" r="7" fill="#fff" stroke="#2f6b3f" stroke-width="2"/><circle cx="70" cy="86" r="3" fill="#2f6b3f"/>
  <rect x="86" y="77" width="60" height="18" rx="9" fill="#2f6b3f"/><text x="116" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ID-3</text>
  <text x="156" y="90" font-size="11.5" fill="#1c1c1c">spike / sub-item &mdash; <tspan font-weight="700">the winning approach</tspan></text>

  <circle cx="30" cy="119" r="8" fill="#fff" stroke="#1f3756" stroke-width="2"/><circle cx="30" cy="119" r="3.5" fill="#1f3756"/>
  <rect x="48" y="110" width="60" height="18" rx="9" fill="#1f3756"/><text x="78" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ID-4</text>
  <text x="118" y="123" font-size="11.5" fill="#1c1c1c">third milestone &mdash; another step on the spine</text>

  <!-- closed / superseded node (grey) -->
  <circle cx="30" cy="152" r="8" fill="#fff" stroke="#8a93a0" stroke-width="2"/><circle cx="30" cy="152" r="3.5" fill="#8a93a0"/>
  <rect x="48" y="143" width="60" height="18" rx="9" fill="#8a93a0"/><text x="78" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ID-5</text>
  <text x="118" y="156" font-size="11.5" fill="#1c1c1c">closed / superseded &mdash; greyed to show it is no longer live</text>
</svg>
